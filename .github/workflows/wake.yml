name: Wake Lightning Studio
on:
  workflow_dispatch:   # manual/API trigger only — no schedule
jobs:
  wake:
    runs-on: ubuntu-latest
    steps:
      - name: Install Lightning SDK
        run: pip install lightning-sdk
      - name: Wake studio
        env:
          LIGHTNING_USER_ID: ${{ secrets.LIGHTNING_USER_ID }}
          LIGHTNING_API_KEY: ${{ secrets.LIGHTNING_API_KEY }}
        run: |
          python -c "
          from lightning_sdk import Studio, Status
          studio = Studio(name='video-renderer', teamspace='data-optimization-project', org='team-8wppe')
          status = studio.status
          print(f'Current status: {status}')
          if status == Status.Running:
              print('Already running, skipping start.')
          else:
              studio.start()
              print(f'Start triggered (was {status}).')
          "
